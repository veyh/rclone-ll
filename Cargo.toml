[package]
name = "rclone-ll"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/veyh/rclone-ll"

[dependencies]
anyhow = "1.0.71"
clap = { version = "4.3.5", features = ["derive", "env"] }
colorful = "0.2.2"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
subprocess = "0.2.9"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
